[package]
name = "libauthcekunit"
version = "2.0.3"
edition = "2021"
description = "Super robust CSRF token extractor with configurable retry, logging, and strict validation"
license = "MIT"
readme = "README.md"
repository = "https://github.com/neuxdotdev/libauthcekunit"
homepage = "https://github.com/neuxdotdev/libauthcekunit"
documentation = "https://docs.rs/libauthcekunit"
keywords = ["csrf", "token", "extractor", "authentication", "cookie"]
categories = ["web-programming", "authentication", "command-line-utilities"]
exclude = ["/a", ".env.example", "tests.c"]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
backoff = "0.4.0"
chrono = "0.4.44"
dotenv = "0.15.0"
once_cell = "1.21.4"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["blocking", "cookies", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]